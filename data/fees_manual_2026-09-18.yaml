# Значения, собранные вручную 2026-09-18.
#
# Происхождение. Числа выписаны вручную с официальных страниц бирж;
# первичные снимки страниц не сохранены. Это вторичный источник:
# без API-ключа проверить их прогоном нельзя. Поле source у каждой записи
# говорит об этом прямо, и та же пометка уходит в комментарий config.yaml.
# Перед финальным прогоном их стоит пересмотреть - см. docs/values_to_fetch.md.
#
# Исключение - комиссия тейкера Kraken: она совпала с прогоном
# официальной страницы от 2026-09-17, и там источник первичный.
#
# Соглашение по подтверждениям. Там, где источник даёт два числа
# («1 для депозита / 2 для вывода»), берём число для ЗАЧИСЛЕНИЯ ДЕПОЗИТА:
# в схеме арбитража мы ждём именно зачисления на бирже-получателе, чтобы
# продать. Второе число относится к разблокировке средств под вывод
# и в нашу модель не входит.

